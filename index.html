<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ابزارها</title>
<meta name="description" content="Small single-page tools for everyday tasks, in Persian and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --border: #e2e0da;
    --accent: #2f6f5e;
    --focus: #2f6f5e55;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1e1e21;
      --text: #ececee;
      --muted: #9a9aa2;
      --border: #333338;
      --accent: #6cc4a8;
      --focus: #6cc4a855;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Vazirmatn", system-ui, sans-serif;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

  /* Workspace: a tab bar and one panel per tab. Horizontal puts the bar on
     top; vertical puts it at the start side (the right, in RTL). */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .app.vertical { flex-direction: row; }
  .tabbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    min-width: 0;
  }
  .vertical .tabbar {
    flex-direction: column;
    align-items: stretch;
    width: 220px;
    flex: 0 0 auto;
    border-bottom: 0;
    border-inline-end: 1px solid var(--border);
  }
  .tabs { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: thin; }
  .vertical .tabs { flex-direction: column; overflow-x: hidden; overflow-y: auto; }
  .tab {
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    max-width: 220px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
  }
  .vertical .tab { max-width: none; }
  .tab.active { border-color: var(--accent); background: var(--surface); color: var(--accent); font-weight: 600; }
  .tab-select {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 36px;
    padding: 4px 12px;
    border: 0;
    background: none;
    text-align: start;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    font-size: .95rem;
  }
  .tab-close {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    margin-inline-end: 2px;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
  }
  .tab-close:hover { color: var(--text); background: var(--bg); }
  .layout-toggle {
    flex: 0 0 auto;
    min-height: 36px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font-size: .9rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .layout-toggle .short { display: none; }
  @media (max-width: 600px) { .layout-toggle .short { display: inline; } }
  .layout-toggle:hover { border-color: var(--accent); color: var(--text); }
  .panels { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
  /* Hidden panels stay in the DOM, so each tab keeps its text and scroll. */
  .panel { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  .panel[hidden] { display: none; }
  .home { overflow-y: auto; }

  @media (max-width: 600px) {
    .tabbar { padding: 6px 8px; }
    .vertical .tabbar { width: 120px; }
    .layout-toggle .long { display: none; }
    .tab-select { padding: 4px 8px; font-size: .85rem; }
    .tab-close { width: 28px; height: 28px; }
  }

  /* Home tab: the list of tools. */
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .lead { color: var(--muted); margin: 4px 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
  .card {
    display: block;
    height: 100%;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: inherit;
    text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card h2 { font-size: 1.1rem; margin: 0 0 4px; color: var(--accent); }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .hint { color: var(--muted); font-size: .9rem; margin: 16px 0 0; }
  footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="tabbar" data-i18n-aria="tabs" aria-label="تب‌ها">
    <div class="tabs" id="tabs" role="tablist">
      <div class="tab active" data-id="home">
        <button type="button" class="tab-select" role="tab" aria-selected="true" aria-controls="panel-home" id="tab-home" data-i18n="home">ابزارها</button>
      </div>
    </div>
    <button type="button" class="layout-toggle" id="langToggle"></button>
    <button type="button" class="layout-toggle" id="layoutToggle"></button>
  </nav>

  <main class="panels" id="panels">
    <section class="panel home" id="panel-home" role="tabpanel" aria-labelledby="tab-home">
      <div class="wrap">
        <h1 data-i18n="home">ابزارها</h1>
        <p class="lead" data-i18n="lead">ابزارهای کوچک یک‌صفحه‌ای برای کارهای روزمره، بدون ثبت‌نام و بدون ردیابی.</p>

        <ul class="grid">
          <li>
            <a class="card" href="reader/index.html" data-tool="reader">
              <h2 data-i18n="reader">خواننده</h2>
              <p data-i18n="reader-desc">متن فارسی یا انگلیسی را بچسبانید و با جهت درست، فونت خوانا و مارک‌داون بخوانید.</p>
            </a>
          </li>
        </ul>

        <p class="hint" data-i18n="hint">هر ابزار در یک تب تازه باز می‌شود؛ می‌توانید از یک ابزار چند تب داشته باشید.</p>
        <footer><span data-i18n="source">کد منبع این ابزارها آزاد است:</span> <a href="https://github.com/margani/tools">GitHub</a></footer>
      </div>
    </section>
  </main>
</div>

<script>
  const app = document.getElementById('app');
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  const layoutToggle = document.getElementById('layoutToggle');
  const langToggle = document.getElementById('langToggle');

  // UI language (#14), shared with every tool through tools:lang. The first
  // visit follows the browser: Persian browsers get فارسی, the rest English.
  const STRINGS = {
    fa: {
      title: 'ابزارها',
      home: 'ابزارها',
      tabs: 'تب‌ها',
      lead: 'ابزارهای کوچک یک‌صفحه‌ای برای کارهای روزمره، بدون ثبت‌نام و بدون ردیابی.',
      reader: 'خواننده',
      'reader-desc': 'متن فارسی یا انگلیسی را بچسبانید و با جهت درست، فونت خوانا و مارک‌داون بخوانید.',
      hint: 'هر ابزار در یک تب تازه باز می‌شود؛ می‌توانید از یک ابزار چند تب داشته باشید.',
      source: 'کد منبع این ابزارها آزاد است:',
      vertical: 'عمودی',
      horizontal: 'افقی',
      layoutLong: n => 'چیدمان ' + n + ' تب‌ها',
      close: n => 'بستن تب ' + n,
    },
    en: {
      title: 'Tools',
      home: 'Tools',
      tabs: 'Tabs',
      lead: 'Small single-page tools for everyday tasks, with no sign-up and no tracking.',
      reader: 'Reader',
      'reader-desc': 'Paste Persian or English text and read it in the right direction, in a clear font, plain or Markdown.',
      hint: 'Each tool opens in a new tab; you can have several tabs of the same tool.',
      source: 'These tools are open source:',
      vertical: 'Vertical',
      horizontal: 'Horizontal',
      layoutLong: n => n + ' tabs',
      close: n => 'Close tab ' + n,
    },
  };
  const LANG_KEY = 'tools:lang';
  let lang = 'en';
  try {
    const saved = localStorage.getItem(LANG_KEY);
    lang = saved === 'fa' || saved === 'en' ? saved : null;
  } catch (e) { lang = null; }
  if (!lang) lang = (navigator.languages || [navigator.language]).some(l => /^fa(-|$)/i.test(l)) ? 'fa' : 'en';
  const t = key => STRINGS[lang][key];
  // file:// pages have no origin to name, so only there the message goes to '*'.
  const frameOrigin = location.protocol === 'file:' ? '*' : location.origin;

  // Layout is remembered too. Open tabs are not restored: their text lives
  // only inside each tab, so a restored tab would come back empty.
  const LAYOUT_KEY = 'tools:tab-layout';
  let layout = 'horizontal';
  try { if (localStorage.getItem(LAYOUT_KEY) === 'vertical') layout = 'vertical'; } catch (e) {}
  function applyLayout() {
    app.classList.toggle('vertical', layout === 'vertical');
    const next = t(layout === 'vertical' ? 'horizontal' : 'vertical');
    // The full label takes half the bar at phone width; there only the word shows.
    layoutToggle.replaceChildren();
    const long = document.createElement('span');
    long.className = 'long';
    long.textContent = t('layoutLong')(next);
    const short = document.createElement('span');
    short.className = 'short';
    short.textContent = next;
    layoutToggle.append(long, short);
    layoutToggle.title = long.textContent;
    layoutToggle.setAttribute('aria-label', long.textContent);
  }
  layoutToggle.addEventListener('click', () => {
    layout = layout === 'vertical' ? 'horizontal' : 'vertical';
    applyLayout();
    try { localStorage.setItem(LAYOUT_KEY, layout); } catch (e) {}
  });

  const tabs = new Map(); // id -> { tab, panel, tool, count, title }
  tabs.set('home', { tab: tabsEl.querySelector('[data-id="home"]'), panel: document.getElementById('panel-home') });
  let seq = 0;
  const opened = {}; // tool -> how many tabs of it were opened, for "خواننده ۲"

  // A tool's own name for its tab (its first words) wins; otherwise the tool's
  // name in the UI language, numbered from the second tab of the same tool.
  function labelOf(entry) {
    if (entry.title) return entry.title;
    const name = t(entry.tool);
    return entry.count > 1 ? name + ' ' + entry.count.toLocaleString(lang === 'fa' ? 'fa-IR' : 'en-US') : name;
  }
  function refreshLabel(entry) {
    const btn = entry.tab.querySelector('.tab-select');
    btn.textContent = labelOf(entry);
    btn.title = btn.textContent;
    entry.panel.title = btn.textContent;
    entry.tab.querySelector('.tab-close').setAttribute('aria-label', t('close')(btn.textContent));
  }

  function applyLang() {
    const root = document.documentElement;
    root.lang = lang;
    root.dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.title = t('title');
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-aria]')) el.setAttribute('aria-label', t(el.dataset.i18nAria));
    langToggle.textContent = lang === 'fa' ? 'English' : 'فارسی';
    langToggle.lang = lang === 'fa' ? 'en' : 'fa';
    applyLayout();
    for (const [id, entry] of tabs) {
      if (id === 'home') continue;
      refreshLabel(entry);
      entry.panel.contentWindow?.postMessage({ type: 'tools:lang', lang }, frameOrigin);
    }
  }
  langToggle.addEventListener('click', () => {
    lang = lang === 'fa' ? 'en' : 'fa';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyLang();
  });

  function activate(id) {
    for (const [key, entry] of tabs) {
      const on = key === id;
      entry.tab.classList.toggle('active', on);
      entry.tab.querySelector('.tab-select').setAttribute('aria-selected', on);
      entry.panel.hidden = !on;
    }
    tabs.get(id).tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function openTool(href, tool) {
    const id = 't' + (++seq);
    opened[tool] = (opened[tool] || 0) + 1;

    const panel = document.createElement('iframe');
    panel.className = 'panel';
    panel.id = 'panel-' + id;
    // The tool may not share this page's storage (file://), so it is told the language.
    panel.src = href + '?lang=' + lang;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', 'tab-' + id);

    const tab = document.createElement('div');
    tab.className = 'tab';
    tab.dataset.id = id;
    const select = document.createElement('button');
    select.type = 'button';
    select.className = 'tab-select';
    select.id = 'tab-' + id;
    select.setAttribute('role', 'tab');
    select.setAttribute('aria-controls', panel.id);
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'tab-close';
    close.textContent = '×';
    tab.append(select, close);

    const entry = { tab, panel, tool, count: opened[tool], title: '' };
    tabs.set(id, entry);
    refreshLabel(entry);
    tabsEl.append(tab);
    panelsEl.append(panel);
    activate(id);
  }

  function closeTab(id) {
    const ids = [...tabs.keys()];
    const entry = tabs.get(id);
    const wasActive = entry.tab.classList.contains('active');
    entry.tab.remove();
    entry.panel.remove();
    tabs.delete(id);
    if (wasActive) activate(ids[ids.indexOf(id) - 1] || 'home');
  }

  // One handler for every tab, the home tab included: per-tab listeners left
  // the home tab without one, so the tool list could not be reached again.
  tabsEl.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    if (e.target.closest('.tab-close')) closeTab(tab.dataset.id);
    else if (e.target.closest('.tab-select')) activate(tab.dataset.id);
  });

  // A plain click opens the tool in a tab here; Ctrl, Shift, Cmd or a middle
  // click still opens a real browser tab, as with any link.
  for (const card of document.querySelectorAll('.card')) {
    card.addEventListener('click', e => {
      if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openTool(card.getAttribute('href'), card.dataset.tool);
    });
  }

  // A tool may name its tab, e.g. after the first words of its text:
  // parent.postMessage({ type: 'tools:title', title }). Only our own frames
  // count; an empty title restores the tool's name.
  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'tools:title') return;
    for (const entry of tabs.values()) {
      if (entry.panel.contentWindow && entry.panel.contentWindow === e.source) {
        entry.title = String(e.data.title || '').trim().slice(0, 60);
        refreshLabel(entry);
      }
    }
  });

  applyLang();
</script>
</body>
</html>
